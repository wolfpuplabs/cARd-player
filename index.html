<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PlayXR - Red Panda AR</title>
  
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    /* =========================================
       MODERN ANIMATED UI STYLES
       ========================================= */
    body { 
      margin: 0; 
      overflow: hidden; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      background-color: #000;
    }
    
    #spatial-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, rgba(15, 20, 30, 0.6) 0%, rgba(0, 0, 0, 0.9) 100%);
      backdrop-filter: blur(20px); 
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      color: white;
      text-align: center;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-panel {
      background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.03) 100%);
      padding: 50px 40px;
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.05);
      max-width: 85%;
      width: 320px;
      animation: float 6s ease-in-out infinite;
    }

    .logo {
      width: 140px;
      margin-bottom: 25px;
      animation: pulseGlow 3s infinite alternate;
    }

    h1 { 
      margin-top: 0; font-size: 24px; font-weight: 600; 
      background: linear-gradient(to right, #fff, #a1c4fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    p { font-size: 15px; opacity: 0.7; margin-bottom: 35px; line-height: 1.6; font-weight: 300; }

    /* Animated Glow Button */
    .btn-start {
      position: relative;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 16px 40px;
      font-size: 16px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 1px;
      overflow: hidden;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }
    
    .btn-start:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(255, 255, 255, 0.15);
    }

    .btn-start:active { transform: scale(0.95); }

    .btn-start::before {
      content: '';
      position: absolute;
      top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      animation: shine 3s infinite;
    }

    .loading-text {
      font-size: 13px;
      margin-top: 20px;
      opacity: 0;
      color: #a1c4fd;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: pulse 1.5s infinite;
    }

    /* Keyframes for Animations */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
    @keyframes pulseGlow {
      0% { filter: drop-shadow(0 0 5px rgba(255,255,255,0.2)); }
      100% { filter: drop-shadow(0 0 15px rgba(255,255,255,0.6)); }
    }
    @keyframes shine {
      0% { left: -100%; }
      20% { left: 100%; }
      100% { left: 100%; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* Custom Scanning UI Overlay */
    #scan-ui {
      display: none; position: absolute;
      top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 80vw; height: 80vw; max-width: 400px; max-height: 400px;
      border: 2px dashed rgba(255, 255, 255, 0.4);
      border-radius: 20px;
      pointer-events: none;
      z-index: 100;
      animation: scanPulse 2s infinite alternate;
    }
    @keyframes scanPulse {
      0% { border-color: rgba(255,255,255,0.2); transform: translate(-50%, -50%) scale(0.98); }
      100% { border-color: rgba(255,255,255,0.6); transform: translate(-50%, -50%) scale(1.02); }
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const overlay = document.querySelector('#spatial-overlay');
      const startBtn = document.querySelector('.btn-start');
      const loadingText = document.querySelector('.loading-text');
      const scanUI = document.querySelector('#scan-ui');
      
      // Ambil elemen Video dan Audio Narasi
      const video = document.querySelector("#panda-video");
      const narration = document.querySelector("#panda-narration");

      startBtn.addEventListener('click', function() {
        // Unlock autoplay policy untuk kedua media
        video.muted = false;
        
        video.play().then(() => video.pause()).catch(e => console.log("Video pending"));
        narration.play().then(() => narration.pause()).catch(e => console.log("Audio pending"));

        // Transisi UI
        startBtn.style.display = 'none';
        loadingText.style.opacity = '1';
        loadingText.innerText = "INITIALIZING AR ENGINE...";

        // Hapus overlay dan tampilkan Custom Scanner UI
        setTimeout(() => {
          overlay.style.opacity = '0';
          setTimeout(() => {
            overlay.style.display = 'none';
            scanUI.style.display = 'block'; // Tampilkan frame scanner
          }, 800);
        }, 1500);
      });
    });

    // Komponen untuk sinkronisasi play/pause Video dan Narasi
    AFRAME.registerComponent('vidhandler', {
      init: function () {
        const video = document.querySelector("#panda-video");
        const narration = document.querySelector("#panda-narration");
        const scanUI = document.querySelector('#scan-ui');
        
        this.el.addEventListener('targetFound', () => {
          // Sembunyikan scanner frame saat ketemu
          if(scanUI) scanUI.style.display = 'none'; 
          
          // Mainkan video (nature) dan narasi (vocal) secara bersamaan
          video.play();
          narration.play();
        });

        this.el.addEventListener('targetLost', () => {
          // Munculkan scanner lagi saat marker hilang
          if(scanUI) scanUI.style.display = 'block'; 
          
          video.pause();
          narration.pause();
        });
      }
    });
  </script>
</head>
<body>
  
  <!-- UI Spatial Vibes -->
  <div id="spatial-overlay">
    <div class="glass-panel">
      <!-- Logo PlayXR -->
      <img src="logo-playxr.svg" alt="PlayXR Logo" class="logo">
      
      <h1>Panda Merah AR</h1>
      <p>Nyalakan volume Anda. Posisikan marker di dalam area bingkai untuk melihat keajaiban.</p>
      <button class="btn-start">MULAI PENGALAMAN</button>
      <div class="loading-text"></div>
    </div>
  </div>

  <!-- Custom Scan Frame (Muncul setelah klik mulai) -->
  <div id="scan-ui"></div>

  <!-- Scene WebAR -->
  <a-scene mindar-image="imageTargetSrc: ./targets.mind; uiLoading: no; uiScanning: no;" 
           color-space="sRGB" 
           renderer="colorManagement: true, physicallyCorrectLights" 
           vr-mode-ui="enabled: false" 
           device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <!-- 1. Video dengan audio nature asli -->
      <video id="panda-video" 
             src="Red_panda_with_info_pop_202608111634.mp4" 
             preload="auto" 
             crossorigin="anonymous" 
             playsinline 
             webkit-playsinline 
             loop>
      </video>
      
      <!-- 2. Audio narasi terpisah -->
      <!-- Siapkan file mp3 khusus suara vokalnya saja (tanpa musik agar tidak tabrakan) -->
      <audio id="panda-narration" 
             src="narration.mp3" 
             preload="auto" 
             crossorigin="anonymous" 
             loop>
      </audio>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- AR Target -->
    <a-entity mindar-image-target="targetIndex: 0" vidhandler>
      <a-video src="#panda-video" 
               position="0 0 0" 
               rotation="0 0 0" 
               width="1" 
               height="1.77">
      </a-video>
    </a-entity>
    
  </a-scene>

</body>
</html>
