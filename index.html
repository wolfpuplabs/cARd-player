<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MindAR - Red Panda WebAR</title>
  
  <!-- Import A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- Import MindAR Image Tracking khusus A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- Script deteksi tracking -->
  <script>
    AFRAME.registerComponent('vidhandler', {
      init: function () {
        const video = document.querySelector("#panda-video");

        // Event saat target terdeteksi di kamera
        this.el.addEventListener('targetFound', () => {
          video.play();
        });

        // Event saat target hilang dari kamera
        this.el.addEventListener('targetLost', () => {
          video.pause();
        });
      }
    });
  </script>
</head>

<body style="margin: 0; overflow: hidden;">
  
  <!-- Scene MindAR: 'imageTargetSrc' mengarah ke file .mind kamu -->
  <a-scene mindar-image="imageTargetSrc: ./targets.mind;" 
           color-space="sRGB" 
           renderer="colorManagement: true, physicallyCorrectLights" 
           vr-mode-ui="enabled: false" 
           device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <video id="panda-video" 
             src="Red_panda_with_info_pop_202608111634.mp4" 
             preload="auto" 
             crossorigin="anonymous" 
             playsinline 
             webkit-playsinline 
             loop 
             muted>
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- targetIndex: 0 (Mengacu pada target pertama di file .mind) -->
    <a-entity mindar-image-target="targetIndex: 0" vidhandler>
      <a-video src="#panda-video" 
               position="0 0 0" 
               rotation="0 0 0" 
               width="1" 
               height="1.77">
      </a-video>
    </a-entity>
    
  </a-scene>

</body>
</html>
