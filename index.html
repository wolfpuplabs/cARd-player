<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Red Panda WebAR</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <script>
    AFRAME.registerComponent('vidhandler', {
      init: function () {
        this.vid = document.querySelector("#my-video");

        // Autoplay saat marker frame pertama video terdeteksi
        this.el.addEventListener('markerFound', () => {
          this.vid.play();
        });

        // Pause saat marker hilang
        this.el.addEventListener('markerLost', () => {
          this.vid.pause();
        });
      }
    });
  </script>
</head>

<body style="margin: 0; overflow: hidden;">
  
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">
    
    <a-assets>
      <video id="my-video" 
             crossorigin="anonymous" 
             playsinline 
             webkit-playsinline 
             loop 
             muted 
             src="Red_panda_with_info_pop_202608111634.mp4">
      </video>
    </a-assets>

    <a-marker type="pattern" url="pattern-panda.patt" vidhandler>
      
      <a-video src="#my-video" 
               position="0 0.1 0" 
               rotation="-90 0 0" 
               width="1" 
               height="1.77">
      </a-video>

    </a-marker>

    <a-entity camera></a-entity>
    
  </a-scene>

</body>
</html>
