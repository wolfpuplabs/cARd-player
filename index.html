<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>WebAR Marker-based Video</title>
  
  <!-- Import library A-Frame -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <!-- Import library AR.js khusus untuk A-Frame -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <!-- Script kustom untuk memutar/menjeda video saat marker ditemukan/hilang -->
  <script>
    AFRAME.registerComponent('vidhandler', {
      init: function () {
        // Ambil elemen video berdasarkan ID
        this.vid = document.querySelector("#my-video");

        // Event saat marker terdeteksi oleh kamera
        this.el.addEventListener('markerFound', () => {
          this.vid.play();
        });

        // Event saat marker hilang dari kamera
        this.el.addEventListener('markerLost', () => {
          this.vid.pause();
        });
      }
    });
  </script>
</head>

<body style="margin: 0; overflow: hidden;">
  
  <!-- Inisialisasi Scene AR -->
  <!-- 'embedded' agar menempel di body HTML, 'arjs' memanggil webcam -->
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">
    
    <!-- A-Assets: Tempat mendefinisikan resource yang akan digunakan -->
    <a-assets>
      <!-- 
        PENTING: Gunakan 'playsinline' dan 'muted' agar bisa autoplay di HP (iOS/Android).
        Browser modern memblokir video dengan suara (unmuted) tanpa interaksi klik dari user.
      -->
      <video id="my-video" 
             crossorigin="anonymous" 
             playsinline 
             webkit-playsinline 
             loop 
             muted 
             src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4">
      </video>
    </a-assets>

    <!-- 
      Mendefinisikan Marker. 
      preset="hiro" berarti kita menggunakan marker default AR.js (Hiro Marker).
      vidhandler adalah komponen yang kita buat di script atas.
    -->
    <a-marker preset="hiro" vidhandler>
      
      <!-- 
        Menampilkan video di atas marker.
        rotation="-90 0 0" membuat video tertidur rata mengikuti kertas/layar marker.
      -->
      <a-video src="#my-video" 
               position="0 0.1 0" 
               rotation="-90 0 0" 
               width="1.6" 
               height="0.9">
      </a-video>

    </a-marker>

    <!-- Kamera untuk melihat AR -->
    <a-entity camera></a-entity>
    
  </a-scene>

</body>
</html>
