<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PlayXR - Red Panda AR & 3D</title>
  
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.1.1/model-viewer.min.js"></script>

  <style>
    body { 
      margin: 0; overflow: hidden; background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    
    #spatial-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, rgba(15, 20, 30, 0.6) 0%, rgba(0, 0, 0, 0.9) 100%);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 9999; color: white; text-align: center; transition: opacity 0.8s ease;
    }

    .glass-panel {
      background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.03) 100%);
      padding: 50px 40px; border-radius: 32px; border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); max-width: 85%; width: 320px;
      animation: float 6s ease-in-out infinite;
    }

    h1 { margin-top: 0; font-size: 24px; font-weight: 600; }
    p { font-size: 15px; opacity: 0.7; margin-bottom: 35px; line-height: 1.6; }

    .btn-start {
      background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 16px 40px; font-size: 16px; border-radius: 40px; cursor: pointer;
      font-weight: 600; transition: all 0.3s ease;
    }
    
    #scan-ui {
      display: none; position: absolute; top: 15px; left: 15px; right: 15px; bottom: 15px;
      border: 4px dashed #FFD700; border-radius: 20px; pointer-events: none;
      z-index: 100; animation: scanPulse 1.5s infinite alternate;
      box-sizing: border-box;
    }

    #ar-logo {
      display: none; position: absolute; top: 35px; left: 50%; transform: translateX(-50%);
      width: 150px; z-index: 101; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));
    }

    #btn-3d {
      display: none; position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
      background: #FFD700; color: #000; border: none; padding: 14px 35px;
      border-radius: 30px; font-weight: 700; font-size: 16px; z-index: 101; cursor: pointer;
      pointer-events: auto; text-transform: uppercase; letter-spacing: 1px;
    }

    /* Model viewer untuk Android diletakkan di luar layar agar tidak mengganggu */
    #hidden-model-wrapper {
      position: absolute; width: 1px; height: 1px; overflow: hidden; z-index: -1;
    }

    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
    @keyframes scanPulse { 0% { opacity: 0.6; transform: scale(0.99); } 100% { opacity: 1; transform: scale(1); } }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const overlayStart = document.querySelector('#spatial-overlay');
      const startBtn = document.querySelector('.btn-start');
      const scanUI = document.querySelector('#scan-ui');
      const arLogo = document.querySelector('#ar-logo');
      const btn3D = document.querySelector('#btn-3d');
      
      const video = document.querySelector("#panda-video");
      const narration = document.querySelector("#panda-narration");
      const modelViewer = document.querySelector('model-viewer');

      startBtn.addEventListener('click', function() {
        video.muted = false;
        video.play().then(() => video.pause()).catch(e => console.log("Video pending"));
        narration.play().then(() => narration.pause()).catch(e => console.log("Audio pending"));

        overlayStart.style.opacity = '0';
        setTimeout(() => {
          overlayStart.style.display = 'none';
          scanUI.style.display = 'block';
          arLogo.style.display = 'block';
          btn3D.style.display = 'block';
        }, 800);
      });

      // Logika khusus untuk tombol 3D
      btn3D.addEventListener('click', () => {
        video.pause();
        narration.pause();
        
        // Deteksi apakah perangkat menggunakan iOS (iPhone/iPad)
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

        if (isIOS) {
          // WORKAROUND iOS: Pakai tag link <a> standar Apple dengan rel="ar".
          // Cara ini mencegah bentrok kamera dengan browser dan memaksa sistem langsung masuk ke AR.
          const arLink = document.createElement('a');
          arLink.setAttribute('rel', 'ar');
          arLink.setAttribute('href', 'Red%20Panda.usdz');
          
          // Syarat mutlak Apple: harus ada tag <img> di dalam tag <a> agar tombol AR Quick Look bekerja
          const img = document.createElement('img');
          arLink.appendChild(img);
          
          document.body.appendChild(arLink);
          arLink.click();
          document.body.removeChild(arLink);
        } else {
          // Untuk Android (Scene Viewer), gunakan model-viewer seperti biasa
          if (modelViewer.canActivateAR) {
            modelViewer.activateAR();
          } else {
            alert("Perangkat Anda belum mendukung fitur Scan Lantai AR.");
          }
        }
      });
    });

    AFRAME.registerComponent('vidhandler', {
      init: function () {
        const video = document.querySelector("#panda-video");
        const narration = document.querySelector("#panda-narration");
        const scanUI = document.querySelector('#scan-ui');
        
        this.el.addEventListener('targetFound', () => {
          // GARIS PUTUS-PUTUS TIDAK DIHILANGKAN
          // Kita hanya mematikan animasinya agar menjadi frame diam yang fokus
          if(scanUI) {
            scanUI.style.animation = 'none'; 
            scanUI.style.opacity = '1';
          }
          video.play(); narration.play();
        });

        this.el.addEventListener('targetLost', () => {
          // Nyalakan kembali animasi kedap-kedip saat gambar hilang (mencari)
          if(scanUI) {
            scanUI.style.animation = 'scanPulse 1.5s infinite alternate';
          }
          video.pause(); narration.pause();
        });
      }
    });
  </script>
</head>
<body>
  
  <div id="spatial-overlay">
    <div class="glass-panel">
      <img src="logo-playxr.svg" alt="PlayXR Logo" style="width: 120px; margin-bottom: 20px;">
      <h1>Panda Merah AR</h1>
      <p>Nyalakan volume Anda. Arahkan kamera ke marker untuk memulai.</p>
      <button class="btn-start">MULAI</button>
    </div>
  </div>

  <img id="ar-logo" src="logo-playxr.svg" alt="PlayXR">
  <div id="scan-ui"></div>
  <button id="btn-3d">LIHAT 3D</button>

  <div id="hidden-model-wrapper">
    <model-viewer 
      src="Red%20Panda.glb" 
      ar 
      ar-modes="webxr scene-viewer" 
      alt="3D Red Panda" 
      autoplay>
    </model-viewer>
  </div>

  <a-scene mindar-image="imageTargetSrc: ./targets.mind; uiLoading: no; uiScanning: no;" 
           color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" 
           vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <video id="panda-video" src="Red_panda_with_info_pop_202608111634.mp4" preload="auto" crossorigin="anonymous" playsinline webkit-playsinline loop></video>
      <audio id="panda-narration" src="narration.mp3" preload="auto" crossorigin="anonymous" loop></audio>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" vidhandler>
      <a-video src="#panda-video" position="0 0 0" rotation="0 0 0" width="1" height="1.77"></a-video>
    </a-entity>
    
  </a-scene>

</body>
</html>
